name: Publiceer Het Berkenbos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download website
        uses: actions/checkout@v6
      - name: Gebruik Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installeer website
        run: npm ci
      - name: Bouw website
        run: npm run build:github-pages
      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist
      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
